name: enterprise-hub-staging

services:
  qdrant:
    image: ${ENTERPRISE_HUB_QDRANT_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ${ENTERPRISE_HUB_API_IMAGE}
    restart: unless-stopped
    mem_limit: 1g
    network_mode: host
    env_file:
      - ${ENTERPRISE_HUB_RUNTIME_ENV_FILE:-/opt/enterprise-hub/runtime.env}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3000"
      ENTERPRISE_HUB_PUBLIC_ORIGIN: ${ENTERPRISE_HUB_PUBLIC_ORIGIN:-https://api.smedatacenter.xyz}
    depends_on:
      - qdrant

  worker:
    image: ${ENTERPRISE_HUB_WORKER_IMAGE}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${ENTERPRISE_HUB_RUNTIME_ENV_FILE:-/opt/enterprise-hub/runtime.env}
    environment:
      NODE_ENV: production
    volumes:
      - /opt/enterprise-hub/partition-work:/var/lib/enterprise-hub/partition-work
    depends_on:
      - qdrant

  release-ops:
    image: ${ENTERPRISE_HUB_RELEASE_OPS_IMAGE}
    profiles: ["release"]
    network_mode: host
    env_file:
      - ${ENTERPRISE_HUB_RUNTIME_ENV_FILE:-/opt/enterprise-hub/runtime.env}
    environment:
      NODE_ENV: production
      ENTERPRISE_HUB_PUBLIC_ORIGIN: ${ENTERPRISE_HUB_PUBLIC_ORIGIN:-https://api.smedatacenter.xyz}

volumes:
  qdrant_data:
