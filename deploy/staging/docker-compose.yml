name: smedc-staging

services:
  qdrant:
    image: ${SMEDC_QDRANT_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ${SMEDC_API_IMAGE}
    restart: unless-stopped
    mem_limit: 1g
    network_mode: host
    env_file:
      - ${SMEDC_RUNTIME_ENV_FILE:-/opt/smedc/runtime.env}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3000"
      SMEDC_PUBLIC_ORIGIN: ${SMEDC_PUBLIC_ORIGIN:-https://api.smedatacenter.xyz}
    depends_on:
      - qdrant

  worker:
    image: ${SMEDC_WORKER_IMAGE}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${SMEDC_RUNTIME_ENV_FILE:-/opt/smedc/runtime.env}
    environment:
      NODE_ENV: production
    volumes:
      - /opt/smedc/partition-work:/var/lib/smedc/partition-work
    depends_on:
      - qdrant

  release-ops:
    image: ${SMEDC_RELEASE_OPS_IMAGE}
    profiles: ["release"]
    network_mode: host
    env_file:
      - ${SMEDC_RUNTIME_ENV_FILE:-/opt/smedc/runtime.env}
    environment:
      NODE_ENV: production
      SMEDC_PUBLIC_ORIGIN: ${SMEDC_PUBLIC_ORIGIN:-https://api.smedatacenter.xyz}

volumes:
  qdrant_data:
