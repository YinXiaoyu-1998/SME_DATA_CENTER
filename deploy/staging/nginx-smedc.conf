server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name smedatacenter.xyz www.smedatacenter.xyz;

  return 404;
}
# Live shape after certbot manages TLS for api.smedatacenter.xyz: the API
# server block listens on 443, and port 80 only redirects to HTTPS.
# client_max_body_size must stay inside the TLS server block; without it the
# nginx default of 1m rejects base64 MCP upload payloads with 413, which the
# launcher surfaces as SERVICE_UNAVAILABLE.
server {
  server_name api.smedatacenter.xyz;
  client_max_body_size 72m;

  location = /readyz {
    return 404;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
  }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.smedatacenter.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.smedatacenter.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.smedatacenter.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name api.smedatacenter.xyz;
    return 404; # managed by Certbot


}
