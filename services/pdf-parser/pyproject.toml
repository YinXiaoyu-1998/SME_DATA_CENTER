[project]
name = "smedc-pdf-parser"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.94.0",
    "rapidocr==3.8.0",
    "onnxruntime==1.24.2",
    "pypdfium2==5.8.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "aiohttp==3.14.3",
    "transformers==5.10.1",
]

[dependency-groups]
dev = ["pytest==9.0.2", "reportlab==4.4.10", "fonttools==4.63.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
# Docling internally reads these deprecated fields even when disabled.
# Match the exact messages and emitting modules; all other warnings stay visible.
filterwarnings = [
    'ignore:^This field is deprecated\. Use `generate_page_images=True` and call `TableItem\.get_image\(\)` to extract table images from page images\.$:DeprecationWarning:^docling\.pipeline\.standard_pdf_pipeline$',
    'ignore:^deprecated$:DeprecationWarning:^docling\.models\.stages\.ocr\.rapid_ocr_model$',
]

[tool.hatch.build.targets.wheel]
packages = ["src/smedc_pdf_parser"]

[tool.hatch.build.targets.wheel.force-include]
"model-manifest.json" = "smedc_pdf_parser/model-manifest.json"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
