name: Deploy staging

on:
  workflow_run:
    workflows:
      - Phase 3 quality gates
    types:
      - completed
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected main commit or restore the previous staging release
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read

jobs:
  staging:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && 'Rollback staging' || 'Deploy staging' }}
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: smedc-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://api.smedatacenter.xyz/healthz
    env:
      # Parser uses pdf-<sha> in the account-owned API repository.
      SMEDC_ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      SMEDC_ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      SMEDC_ACR_USERNAME: ${{ vars.ACR_USERNAME }}
      SMEDC_STAGING_HOST: ${{ vars.STAGING_HOST }}
      SMEDC_STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      SMEDC_STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
    steps:
      - name: Check out the trusted release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install staging SSH credential
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_PRIVATE_KEY"
          key_path="$RUNNER_TEMP/smedc-staging/id_ed25519"
          umask 077
          install -d -m 700 "$(dirname "$key_path")"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          printf 'SMEDC_STAGING_SSH_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'workflow_run' || inputs.operation == 'deploy' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Install Trivy
        if: ${{ github.event_name == 'workflow_run' || inputs.operation == 'deploy' }}
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.72.0
          cache: true

      - name: Deploy immutable staging release
        if: ${{ github.event_name == 'workflow_run' || inputs.operation == 'deploy' }}
        env:
          SMEDC_ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SMEDC_STAGING_CURSOR_SIGNING_SECRET: ${{ secrets.STAGING_CURSOR_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SMEDC_ACR_PASSWORD"
          test -n "$SMEDC_STAGING_CURSOR_SIGNING_SECRET"
          npm run deploy:staging

      - name: Restore previous staging release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' }}
        env:
          SMEDC_ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SMEDC_STAGING_CURSOR_SIGNING_SECRET: ${{ secrets.STAGING_CURSOR_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SMEDC_ACR_PASSWORD"
          test -n "$SMEDC_STAGING_CURSOR_SIGNING_SECRET"
          npm run deploy:staging:rollback

      - name: Publish deployment summary
        if: ${{ success() }}
        run: |
          {
            echo "### SMEDC staging"
            echo
            echo "- Operation: \`${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}\`"
            echo "- Commit: \`$(git rev-parse --short=12 HEAD)\`"
            echo "- Health: https://api.smedatacenter.xyz/healthz"
            echo "- Public readiness boundary: https://api.smedatacenter.xyz/readyz returns 404"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove staging SSH credential
        if: ${{ always() }}
        run: |
          if [ -f "$SMEDC_STAGING_SSH_KEY" ]; then
            shred --remove "$SMEDC_STAGING_SSH_KEY"
          fi
