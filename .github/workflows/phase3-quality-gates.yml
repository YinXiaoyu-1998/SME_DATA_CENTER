name: Phase 3 quality gates

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "**/AGENTS.md"
      - "skills/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR work only. Never interrupt a trusted main release gate.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-static:
    name: Unit mocks and static checks
    runs-on: ubuntu-latest
    outputs:
      node_images: ${{ steps.scope.outputs.node_images }}
      pdf: ${{ steps.scope.outputs.pdf }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Select checks for the complete PR diff
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/ci-quality-scope.ts
      - name: Check changed-line whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check
          fi
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: Report production dependency advisories
        if: steps.scope.outputs.code == 'true'
        id: dependency-audit
        continue-on-error: true
        run: npm run audit:production
      - name: Summarize dependency advisories
        if: steps.dependency-audit.outcome == 'failure'
        run: |
          echo "::warning::Production dependency audit reported findings or could not complete. This check is informational; see the audit step for details."
          echo "Production dependency audit is informational and does not block quality gates. See the audit step for findings or scan errors." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.scope.outputs.code == 'true'
        run: npm run db:generate
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - if: steps.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        run: npm run format:check
      - run: git diff --check

  runtime-images:
    name: Hardened linux/amd64 runtime images
    runs-on: ubuntu-latest
    needs: [unit-and-static, pdf-parser-unit]
    if: >-
      ${{ !cancelled() && needs.unit-and-static.result == 'success' &&
          (needs.pdf-parser-unit.result == 'success' || needs.pdf-parser-unit.result == 'skipped') &&
          (needs.unit-and-static.outputs.node_images == 'true' || needs.unit-and-static.outputs.pdf == 'true') }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build api image
        if: needs.unit-and-static.outputs.node_images == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: api
          platforms: linux/amd64
          pull: true
          load: true
          tags: smedc-api:ci
          no-cache-filters: runtime-base
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,scope=ci-api,mode=max
      - name: Build worker image
        if: needs.unit-and-static.outputs.node_images == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: worker
          platforms: linux/amd64
          pull: true
          load: true
          tags: smedc-worker:ci
          no-cache-filters: runtime-base
          cache-from: type=gha,scope=ci-worker
          cache-to: type=gha,scope=ci-worker,mode=max
      - name: Build release-ops image
        if: needs.unit-and-static.outputs.node_images == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: release-ops
          platforms: linux/amd64
          pull: true
          load: true
          tags: smedc-release-ops:ci
          no-cache-filters: runtime-base
          cache-from: type=gha,scope=ci-release-ops
          cache-to: type=gha,scope=ci-release-ops,mode=max
      - name: Prepare cached and verified PDF dependencies
        if: needs.unit-and-static.outputs.pdf == 'true'
        uses: ./.github/actions/pdf-dependencies
      - name: Build PDF parser image
        if: needs.unit-and-static.outputs.pdf == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: services/pdf-parser
          platforms: linux/amd64
          pull: true
          load: true
          tags: smedc-pdf-parser:ci
          build-contexts: model-cache=./services/pdf-parser/.codex-build/pdf-ci/models
          no-cache-filters: runtime
          cache-from: type=gha,scope=ci-pdf-parser
          cache-to: type=gha,scope=ci-pdf-parser,mode=min
      - name: Qualify offline PDF parser with synthetic OCR and bounded failures
        if: needs.unit-and-static.outputs.pdf == 'true'
        run: uv run --python 3.12.14 --locked --project services/pdf-parser python scripts/test-pdf-container.py
      - name: Verify the packaged Calamine reader against the real fixture
        if: needs.unit-and-static.outputs.node_images == 'true'
        run: |
          reader_container="$(docker create smedc-worker:ci)"
          trap 'docker rm -f "$reader_container" >/dev/null' EXIT
          docker cp "$reader_container:/usr/local/bin/smedc-calamine-reader" "$RUNNER_TEMP/smedc-calamine-reader"
          chmod +x "$RUNNER_TEMP/smedc-calamine-reader"
          PATH="$RUNNER_TEMP:$PATH" RUN_CALAMINE_INTEGRATION=1 npm test -- packages/structured-ingestion/src/partition-export.test.ts
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.72.0
          cache: true
      - name: Report runtime image advisories
        id: image-audit
        env:
          CHECK_NODE_IMAGES: ${{ needs.unit-and-static.outputs.node_images }}
          CHECK_PDF: ${{ needs.unit-and-static.outputs.pdf }}
        continue-on-error: true
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d)"
          trap 'rm -rf -- "$report_dir"' EXIT

          audit_status=0
          components=()
          if [ "$CHECK_NODE_IMAGES" = true ]; then components+=(api worker release-ops); fi
          if [ "$CHECK_PDF" = true ]; then components+=(pdf-parser); fi
          for component in "${components[@]}"; do
            pkg_types=os
            if [ "$component" = pdf-parser ]; then pkg_types=os,library; fi
            if trivy image --scanners vuln --pkg-types "$pkg_types" --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --format json --output "$report_dir/$component.json" --platform linux/amd64 "smedc-$component:ci" &&
              npm run audit:report -- --kind trivy --component "$component-image" --input "$report_dir/$component.json"; then
              continue
            fi
            audit_status=1
          done
          exit "$audit_status"
      - name: Summarize runtime image advisories
        if: steps.image-audit.outcome == 'failure'
        run: |
          echo "::warning::Runtime image audit reported findings or could not complete. This check is informational; see the audit step for details."
          echo "Runtime image audit is informational and does not block quality gates. See the audit step for findings or scan errors." >> "$GITHUB_STEP_SUMMARY"

  phase3-real-runtime:
    name: Real MySQL + Qdrant with fake provider
    runs-on: ubuntu-latest
    needs: unit-and-static
    if: needs.unit-and-static.outputs.integration == 'true'
    env:
      COMPOSE_PROJECT_NAME: sme_data_center_ci
      MYSQL_PORT: "3307"
      DATABASE_URL: mysql://smedc:smedc_local_password@127.0.0.1:3307/smedc
      CURSOR_SIGNING_SECRET: replace-with-ci-cursor-signing-secret
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: ./.data/ci/storage
      LLM_PROVIDER: fake
      EXTERNAL_MODEL_EGRESS_ACKNOWLEDGED: "false"
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION_EVIDENCE: smedc_evidence_ci
      PHASE3_PERF_THRESHOLD_MULTIPLIER: "1.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose up -d mysql qdrant
      - name: Wait for MySQL
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' smedc-mysql 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            echo "Waiting for MySQL healthcheck (${attempt}/60), current status: ${status:-unknown}"
            sleep 2
          done
          docker logs smedc-mysql
          exit 1
      - run: npm run db:generate
      - run: npx prisma migrate reset --force --config packages/db/prisma.config.ts
      - run: npm run db:seed
      - run: npm run qdrant:init
      - run: npm run readyz:local
      - run: npm run test:phase3:golden
      - run: npm run test:phase3:perf
      - run: npm run build:release
      - if: needs.unit-and-static.outputs.pdf == 'true'
        run: RUN_PDF_WORKER_PRISMA_INTEGRATION=1 RUN_PDF_RELEASE_PRISMA_INTEGRATION=1 RUN_PDF_ACCEPTANCE_PRISMA_INTEGRATION=1 npm test -- --no-file-parallelism apps/worker/src/pdf-worker.prisma.integration.test.ts scripts/pdf-release.prisma.integration.test.ts scripts/pdf-acceptance.prisma.integration.test.ts
      - run: COMPOSE_PROJECT_NAME=sme_data_center_ci MYSQL_PORT=3307 npm run test:integration

  external-provider-smoke-gated:
    name: External provider smoke gate (manual credentials)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.PHASE3_RUN_EXTERNAL_PROVIDER_SMOKE == 'true' }}
    env:
      LLM_PROVIDER: openai-compatible
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      LLM_EMBEDDING_MODEL: ${{ vars.LLM_EMBEDDING_MODEL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      EXTERNAL_MODEL_EGRESS_ACKNOWLEDGED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- apps/worker/src/model-providers/embedding.test.ts apps/worker/src/model-providers/rerank.test.ts apps/worker/src/model-providers/readiness.test.ts

  pdf-parser-unit:
    name: Locked Python PDF parser tests
    runs-on: ubuntu-latest
    needs: unit-and-static
    if: needs.unit-and-static.outputs.pdf == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pdf-dependencies
      - working-directory: services/pdf-parser
        run: SMEDC_PDF_MODELS_PATH="$PWD/.codex-build/pdf-ci/models" uv run --python 3.12.14 --locked --project . pytest tests -q
