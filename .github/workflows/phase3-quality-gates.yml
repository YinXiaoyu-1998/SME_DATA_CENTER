name: Phase 3 quality gates

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  unit-and-static:
    name: Unit mocks and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Enforce production dependency policy
        run: npm run audit:production
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: git diff --check

  runtime-images:
    name: Hardened linux/amd64 runtime images
    runs-on: ubuntu-latest
    needs: unit-and-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build all runtime targets
        run: |
          docker buildx build --pull --platform linux/amd64 --target api --tag enterprise-hub-api:ci --load .
          docker buildx build --pull --platform linux/amd64 --target worker --tag enterprise-hub-worker:ci --load .
          docker buildx build --pull --platform linux/amd64 --target release-ops --tag enterprise-hub-release-ops:ci --load .
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.72.0
          cache: true
      - name: Enforce runtime image vulnerability policy
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d)"
          trap 'rm -rf -- "$report_dir"' EXIT

          trivy image --scanners vuln --pkg-types os --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --format json --output "$report_dir/api.json" --platform linux/amd64 enterprise-hub-api:ci
          npm run audit:report -- --kind trivy --component api-image --input "$report_dir/api.json"

          trivy image --scanners vuln --pkg-types os --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --format json --output "$report_dir/worker.json" --platform linux/amd64 enterprise-hub-worker:ci
          npm run audit:report -- --kind trivy --component worker-image --input "$report_dir/worker.json"

          trivy image --scanners vuln --pkg-types os --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --format json --output "$report_dir/release-ops.json" --platform linux/amd64 enterprise-hub-release-ops:ci
          npm run audit:report -- --kind trivy --component release-ops-image --input "$report_dir/release-ops.json"

  phase3-real-runtime:
    name: Real MySQL + Qdrant with fake provider
    runs-on: ubuntu-latest
    needs: unit-and-static
    env:
      COMPOSE_PROJECT_NAME: sme_data_center_ci
      MYSQL_PORT: "3307"
      DATABASE_URL: mysql://enterprise_hub:enterprise_hub_local_password@127.0.0.1:3307/enterprise_hub
      CURSOR_SIGNING_SECRET: replace-with-ci-cursor-signing-secret
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: ./.data/ci/storage
      LLM_PROVIDER: fake
      EXTERNAL_MODEL_EGRESS_ACKNOWLEDGED: "false"
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION_EVIDENCE: enterprise_hub_evidence_ci
      PHASE3_PERF_THRESHOLD_MULTIPLIER: "1.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose up -d mysql qdrant
      - name: Wait for MySQL
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' enterprise-hub-mysql 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            echo "Waiting for MySQL healthcheck (${attempt}/60), current status: ${status:-unknown}"
            sleep 2
          done
          docker logs enterprise-hub-mysql
          exit 1
      - run: npm run db:generate
      - run: npx prisma migrate reset --force --config packages/db/prisma.config.ts
      - run: npm run db:seed
      - run: npm run qdrant:init
      - run: npm run readyz:local
      - run: npm run test:phase3:golden
      - run: npm run test:phase3:perf
      - run: COMPOSE_PROJECT_NAME=sme_data_center_ci MYSQL_PORT=3307 npm run test:integration

  external-provider-smoke-gated:
    name: External provider smoke gate (manual credentials)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.PHASE3_RUN_EXTERNAL_PROVIDER_SMOKE == 'true' }}
    env:
      LLM_PROVIDER: openai-compatible
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      LLM_EMBEDDING_MODEL: ${{ vars.LLM_EMBEDDING_MODEL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      EXTERNAL_MODEL_EGRESS_ACKNOWLEDGED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- apps/worker/src/model-providers/embedding.test.ts apps/worker/src/model-providers/rerank.test.ts apps/worker/src/model-providers/readiness.test.ts
