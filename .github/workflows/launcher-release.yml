name: Publish MCP launcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launcher-release.yml"
      - "apps/mcp-launcher/**"
      - "packages/mcp-contract/**"
      - "package.json"
      - "package-lock.json"
    tags:
      - "smedc-mcp-launcher-v*"

permissions:
  contents: read

jobs:
  platform-acceptance:
    name: Native launcher acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install the reviewed npm release
        shell: bash
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - run: npm ci
      - run: npm run build --workspace smedc-mcp-launcher
      - name: Pack the reviewed artifact
        id: pack
        shell: bash
        run: |
          pack_json="$(npm pack --workspace smedc-mcp-launcher --json)"
          tarball="$(
            node -e 'const data=JSON.parse(process.argv[1]);process.stdout.write(data[0].filename)' "$pack_json"
          )"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Install the packed artifact
        run: npm install --prefix "${{ runner.temp }}/launcher-install" --ignore-scripts "./${{ steps.pack.outputs.tarball }}"
      - name: Audit installed production dependencies
        run: npm audit --omit=dev --prefix "${{ runner.temp }}/launcher-install" --audit-level=moderate
      - name: Exercise native secure-store write/read/delete
        if: runner.os != 'Linux'
        run: node apps/mcp-launcher/scripts/keyring-acceptance.mjs "${{ runner.temp }}/launcher-install"
      - name: Exercise installed launcher on headless Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          launcher_bin="${{ runner.temp }}/launcher-install/node_modules/.bin/smedc-mcp-launcher"
          expected_version="$(node -p 'require("./apps/mcp-launcher/package.json").version')"
          test "$("$launcher_bin" --version)" = "$expected_version"
          npm test -- apps/mcp-launcher/src/launcher.test.ts apps/mcp-launcher/src/session.test.ts

  publish:
    runs-on: ubuntu-latest
    needs: platform-acceptance
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install the reviewed npm release
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - run: npm ci
      - run: npm run build --workspace smedc-mcp-launcher
      - run: npm run test:package --workspace smedc-mcp-launcher
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate release ref
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/mcp-launcher/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#smedc-mcp-launcher-v}"
            test "$tag_version" = "$package_version"
          else
            test "$GITHUB_REF_NAME" = "main"
          fi
      - name: Check release integrity, stage publish, or require first-publish bootstrap
        run: |
          set -euo pipefail
          package_name=smedc-mcp-launcher
          package_version="$(node -p "require('./apps/mcp-launcher/package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            compare_dir="$(mktemp -d)"
            mkdir -p "$compare_dir/registry" "$compare_dir/local" "$compare_dir/extracted-registry" "$compare_dir/extracted-local"
            trap 'rm -rf "$compare_dir"' EXIT
            npm pack "$package_name@$package_version" --pack-destination "$compare_dir/registry" --json >/dev/null
            npm pack --workspace smedc-mcp-launcher --pack-destination "$compare_dir/local" --json >/dev/null
            tar -xzf "$compare_dir/registry/$package_name-$package_version.tgz" -C "$compare_dir/extracted-registry"
            tar -xzf "$compare_dir/local/$package_name-$package_version.tgz" -C "$compare_dir/extracted-local"
            diff -qr "$compare_dir/extracted-registry/package" "$compare_dir/extracted-local/package"
            exit 0
          fi
          if ! npm view "$package_name" name >/dev/null 2>&1; then
            echo "::error title=Initial npm package bootstrap required::$package_name does not exist yet. Publish this reviewed main-branch artifact once with interactive 2FA, configure its Trusted Publisher, then rerun this workflow."
            exit 1
          fi
          cd apps/mcp-launcher
          npm stage publish
