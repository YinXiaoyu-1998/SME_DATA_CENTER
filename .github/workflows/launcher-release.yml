name: Publish MCP launcher

on:
  push:
    tags:
      - "mcp-launcher-v*"

permissions:
  contents: read

jobs:
  platform-acceptance:
    name: Native launcher acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install the reviewed npm release
        shell: bash
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - run: npm ci
      - run: npm run build --workspace enterprise-hub-mcp-launcher
      - name: Pack the reviewed artifact
        id: pack
        shell: bash
        run: |
          pack_json="$(npm pack --workspace enterprise-hub-mcp-launcher --json)"
          tarball="$(
            node -e 'const data=JSON.parse(process.argv[1]);process.stdout.write(data[0].filename)' "$pack_json"
          )"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Install the packed artifact
        run: npm install --prefix "${{ runner.temp }}/launcher-install" --ignore-scripts "./${{ steps.pack.outputs.tarball }}"
      - name: Audit installed production dependencies
        run: npm audit --omit=dev --prefix "${{ runner.temp }}/launcher-install" --audit-level=moderate
      - name: Exercise native secure-store write/read/delete
        run: node apps/mcp-launcher/scripts/keyring-acceptance.mjs "${{ runner.temp }}/launcher-install"

  publish:
    runs-on: ubuntu-latest
    needs: platform-acceptance
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install the reviewed npm release
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - run: npm ci
      - run: npm run build --workspace enterprise-hub-mcp-launcher
      - run: npm run test:package --workspace enterprise-hub-mcp-launcher
      - name: Require the tagged commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate exact tag version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#mcp-launcher-v}"
          package_version="$(node -p "require('./apps/mcp-launcher/package.json').version")"
          test "$tag_version" = "$package_version"
      - name: Check existing release integrity or stage publish
        run: |
          set -euo pipefail
          package_name=enterprise-hub-mcp-launcher
          package_version="$(node -p "require('./apps/mcp-launcher/package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            registry_integrity="$(npm view "$package_name@$package_version" dist.integrity)"
            local_integrity="$(
              npm pack --workspace enterprise-hub-mcp-launcher --json |
                node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>process.stdout.write(JSON.parse(data)[0].integrity))'
            )"
            test -n "$registry_integrity"
            test "$registry_integrity" = "$local_integrity"
            exit 0
          fi
          cd apps/mcp-launcher
          npm stage publish
